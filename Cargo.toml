[package]
name = "tempo-mcp-rs"
version = "0.1.0"
edition = "2021"
description = "MCP server for Tempo blockchain - enabling AI agents to read/write onchain data"
license = "MIT"

[[bin]]
name = "tempo-mcp"
path = "src/main.rs"

[dependencies]
# MCP SDK
rmcp = { version = "0.1", features = ["server", "transport-io"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Ethereum primitives and signing
alloy-primitives = { version = "0.8", features = ["serde", "k256", "rlp"] }
alloy-rlp = { version = "0.3", features = ["derive"] }
k256 = { version = "0.13", features = ["ecdsa"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Serialization
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1"

# Schema generation for MCP tools
schemars = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
hex = "0.4"
